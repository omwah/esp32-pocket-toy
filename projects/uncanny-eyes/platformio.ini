[platformio]
src_dir = .

[env:hosyond_s3_28]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ES3C28P is an N16R8 module: 16 MB flash, 8 MB octal PSRAM.
board_build.flash_mode  = dio
board_build.flash_size  = 16MB
; PSRAM on this module is octal (OPI). Without this the ROM probes it in quad
; mode, fails with "PSRAM ID read error", and ESP.getFreePsram() returns 0.
board_build.arduino.memory_type = dio_opi
board_build.partitions  = partitions.csv
board_build.filesystem  = fatfs
board_upload.flash_size = 16MB

upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_44:1B:F6:CE:4E:40-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_44:1B:F6:CE:4E:40-if00
monitor_speed = 115200

extra_scripts =
    pre:tools/generate_eye_assets.py
    pre:tools/generate_audio_assets.py
build_src_filter = +<src/*.cpp> +<generated/*.cpp>

build_flags =
    -I generated
    ; Route Serial to the native USB port so logs arrive without a UART adapter.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

    -D BOARD_HAS_PSRAM

    ; --- TFT_eSPI configuration for the ES3C28P panel ---
    ; TFT_eSPI's default SPI port for the S3 resolves to REG_SPI_BASE(0), which is
    ; 0 on this chip -- writing the bus mode register then faults on address 0x10.
    ; USE_HSPI_PORT selects SPI3 for both the register access and the SPIClass.
    -D USE_HSPI_PORT=1

    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    ; No dedicated display reset line on this board; it shares the chip reset.
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    ; This IPS panel is inverted relative to the ILI9341 default: without this
    ; every colour renders as its exact complement (black background came up white).
    -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; 80 MHz is beyond what this ILI9341 latches reliably: bytes drop during the
    ; frame transfer and everything after the drop lands shifted horizontally,
    ; which looks like the whole screen jumping sideways. 40 MHz is stable.
    -D SPI_FREQUENCY=60000000
    -D SPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
